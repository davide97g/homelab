  grafana_dashboard_logs_json:
    content: |
      {
        "uid": "homelab-logs",
        "title": "Homelab Logs",
        "tags": [
          "homelab",
          "logs"
        ],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "refresh": "30s",
        "editable": true,
        "graphTooltip": 1,
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "templating": {
          "list": [
            {
              "name": "host",
              "label": "Host",
              "type": "custom",
              "query": "homelab,nas",
              "current": {
                "selected": true,
                "text": "homelab",
                "value": "homelab"
              },
              "options": [
                {
                  "selected": true,
                  "text": "homelab",
                  "value": "homelab"
                },
                {
                  "selected": false,
                  "text": "nas",
                  "value": "nas"
                }
              ],
              "includeAll": false,
              "multi": false,
              "hide": 0
            },
            {
              "name": "container",
              "label": "Container (regex)",
              "description": "Matched with =~, so .+ means every container and qbit.* narrows it.",
              "type": "textbox",
              "query": ".+",
              "current": {
                "selected": false,
                "text": ".+",
                "value": ".+"
              },
              "options": [],
              "hide": 0
            },
            {
              "name": "search",
              "label": "Line contains (regex)",
              "description": "Empty matches everything. Case-insensitive patterns need (?i).",
              "type": "textbox",
              "query": "",
              "current": {
                "selected": false,
                "text": "",
                "value": ""
              },
              "options": [],
              "hide": 0
            }
          ]
        },
        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "Container log volume",
            "description": "Lines per interval, by container. A step change here is usually the first sign of a service that started retrying something.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 16,
              "x": 0,
              "y": 0
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum by (container) (count_over_time({host=\"$$host\", job=\"docker\", container=~\"$$container\"} [$$__auto]))",
                "legendFormat": "{{container}}",
                "queryType": "range"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "logs",
                "custom": {
                  "drawStyle": "bars",
                  "fillOpacity": 60,
                  "lineWidth": 0,
                  "stacking": {
                    "mode": "normal",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "right",
                "showLegend": true,
                "calcs": [
                  "sum"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            }
          },
          {
            "id": 2,
            "type": "timeseries",
            "title": "Error-level lines",
            "description": "Anything matching error, fatal, panic or critical, case-insensitive, across containers and the journal.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 8,
              "w": 8,
              "x": 16,
              "y": 0
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum by (container) (count_over_time({host=\"$$host\", job=\"docker\", container=~\"$$container\"} |~ \"(?i)(error|fatal|panic|critical)\" [$$__auto]))",
                "legendFormat": "{{container}}",
                "queryType": "range"
              },
              {
                "refId": "B",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "sum by (unit) (count_over_time({host=\"$$host\", job=\"journal\", level=~\"err|crit|alert|emerg\"} [$$__auto]))",
                "legendFormat": "journal {{unit}}",
                "queryType": "range"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "logs",
                "custom": {
                  "drawStyle": "bars",
                  "fillOpacity": 70,
                  "lineWidth": 0
                },
                "color": {
                  "mode": "continuous-reds"
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "list",
                "placement": "bottom",
                "showLegend": true
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            }
          },
          {
            "id": 3,
            "type": "timeseries",
            "title": "Journal volume by unit",
            "description": "The host side: kernel, docker.service, cloudflared, tailscaled, sshd. This is what was invisible before Alloy.",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 7,
              "w": 24,
              "x": 0,
              "y": 8
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "topk(10, sum by (unit) (count_over_time({host=\"$$host\", job=\"journal\"} [$$__auto])))",
                "legendFormat": "{{unit}}",
                "queryType": "range"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "logs",
                "custom": {
                  "drawStyle": "bars",
                  "fillOpacity": 60,
                  "lineWidth": 0,
                  "stacking": {
                    "mode": "normal",
                    "group": "A"
                  }
                }
              },
              "overrides": []
            },
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "right",
                "showLegend": true,
                "calcs": [
                  "sum"
                ]
              },
              "tooltip": {
                "mode": "multi",
                "sort": "desc"
              }
            }
          },
          {
            "id": 4,
            "type": "logs",
            "title": "Container logs",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 14,
              "w": 24,
              "x": 0,
              "y": 15
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "{host=\"$$host\", job=\"docker\", container=~\"$$container\"} |~ \"$$search\"",
                "queryType": "range",
                "maxLines": 500
              }
            ],
            "options": {
              "showTime": true,
              "showLabels": false,
              "showCommonLabels": false,
              "wrapLogMessage": true,
              "prettifyLogMessage": false,
              "enableLogDetails": true,
              "dedupStrategy": "none",
              "sortOrder": "Descending"
            }
          },
          {
            "id": 5,
            "type": "logs",
            "title": "Journal",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "gridPos": {
              "h": 14,
              "w": 24,
              "x": 0,
              "y": 29
            },
            "targets": [
              {
                "refId": "A",
                "datasource": {
                  "type": "loki",
                  "uid": "loki"
                },
                "expr": "{host=\"$$host\", job=\"journal\"} |~ \"$$search\"",
                "queryType": "range",
                "maxLines": 500
              }
            ],
            "options": {
              "showTime": true,
              "showLabels": false,
              "showCommonLabels": false,
              "wrapLogMessage": true,
              "prettifyLogMessage": false,
              "enableLogDetails": true,
              "dedupStrategy": "none",
              "sortOrder": "Descending"
            }
          }
        ]
      }
