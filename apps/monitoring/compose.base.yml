# Homelab monitoring stack — Prometheus + Grafana + node_exporter + cAdvisor.
#
# GENERATED FILE when built as docker-compose.yml — edit compose.base.yml and
# dashboards/*.json, then run ./build.py.
#
# Everything is inlined as compose `configs`, so docker-compose.yml is fully
# self-contained: paste it into Dokploy as a Raw compose app, no side files.
#
# Environment (set in the Dokploy Environment tab):
#   GRAFANA_ADMIN_PASSWORD  required
#   QBITTORRENT_USER        required, the qBittorrent WebUI login
#   QBITTORRENT_PASS        required, its password
#   GRAFANA_ROOT_URL        optional, e.g. https://grafana.davideghiotto.it
#   GRAFANA_COOKIE_SECURE   optional, set true once served over HTTPS

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: homelab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=30GB
      - --web.enable-lifecycle
    extra_hosts:
      # node_exporter runs on the host network, so reach it via the bridge gateway.
      - host.docker.internal:host-gateway
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules_yml
        target: /etc/prometheus/rules/homelab.rules.yml
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: homelab-node-exporter
    restart: unless-stopped
    # Host network + host PID so interface, process and sensor metrics are the
    # host's own, not the container's. Root is required to read the hwmon and
    # powercap sensor files.
    network_mode: host
    pid: host
    user: root
    command:
      - --path.rootfs=/host
      - --collector.hwmon
      - --collector.rapl
      # No --collector.systemd. It talks to systemd over the private dbus socket
      # at /run/systemd/private, and --path.rootfs does not redirect that any
      # more than it redirects procfs -- so from inside a container the
      # collector fails on every single scrape and emits nothing:
      # `count({__name__=~"node_systemd.*"})` is empty while
      # node_scrape_collector_success{collector="systemd"} is 0.
      #
      # Failing would be free if it were quiet. It is not: an explicitly enabled
      # collector logs its failure at ERROR, so this wrote 240 lines an hour --
      # every one of node-exporter's own error lines -- saying `couldn't get
      # dbus connection`. That is 3% of the mini PC's log volume, which is
      # survivable, and 100% of what a "show me errors" filter returns for this
      # container, which is not: it buries the errors worth reading.
      #
      # Fixing it properly means mounting /run/systemd/private, which hands the
      # container a control channel to systemd -- it could start and stop units.
      # That is a real privilege increase for metrics no panel plots. The NAS's
      # node_exporter already leaves this off for the same reason.
      #
      # No --collector.processes either. It walks every host PID, the docker-default
      # AppArmor profile denies it ptrace read, and the kernel logged the denial
      # ~2370 times an hour -- 23% of the whole journal, and now 23% of what
      # ships to Loki. Nothing plots node_processes_*, and the process counts
      # that are actually wanted (node_procs_running, node_procs_blocked) come
      # from the always-on stat collector. Re-enable it only alongside
      # `security_opt: [apparmor=unconfined]`, which is a real privilege
      # increase for a metric no panel uses.
      - --collector.netdev.device-exclude=^(veth|docker|br-|lo).*$$
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: homelab-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  json-exporter:
    image: prometheuscommunity/json-exporter:v0.8.0
    container_name: homelab-json-exporter
    restart: unless-stopped
    # Bridges the Tasmota smart plug into Prometheus. The plug speaks JSON over
    # HTTP (/cm?cmnd=Status 10) and has no /metrics of its own, so this maps its
    # ENERGY object onto metrics. Prometheus scrapes this, not the plug.
    command:
      - --config.file=/config.yml
    configs:
      - source: json_exporter_yml
        target: /config.yml
    networks:
      - monitoring

  qbittorrent-exporter:
    image: esanchezm/prometheus-qbittorrent-exporter:sha-5f776a7
    container_name: homelab-qbittorrent-exporter
    restart: unless-stopped
    # Client-wide rates and torrent counts broken down by category and status, so
    # "was qBittorrent seeding at 07:20" is answerable from history. The WebUI is
    # on the host, not in this network, so it is reached through the bridge
    # gateway like node_exporter. The image publishes no semver tags, only latest
    # and sha-*, hence the sha pin.
    #
    # Deliberately NOT per-torrent. The exporters that expose a `name` label put
    # one churning series per torrent into the TSDB, and the obvious candidate
    # (ghcr.io/martabal/qbittorrent-exporter) is also broken against qBittorrent
    # 5.2.3, which answers a successful /auth/login with 204 where the exporter
    # insists on 200. Live per-torrent numbers come from the WebUI API directly,
    # where they belong.
    environment:
      QBITTORRENT_HOST: host.docker.internal
      QBITTORRENT_PORT: "8080"
      QBITTORRENT_USER: ${QBITTORRENT_USER:?set QBITTORRENT_USER in the Dokploy Environment tab}
      QBITTORRENT_PASS: ${QBITTORRENT_PASS:?set QBITTORRENT_PASS in the Dokploy Environment tab}
      EXPORTER_PORT: "8000"
      METRICS_PREFIX: qbittorrent
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.8
    container_name: homelab-loki
    restart: unless-stopped
    # Root because a fresh named volume comes up owned by root and Loki's
    # default uid (10001) cannot create /loki/chunks inside it.
    user: root
    command:
      - --config.file=/etc/loki/loki.yml
    ports:
      # Loopback only. This exists for one reason: cloudflared runs as a host
      # systemd service, not a container, and the NAS can only reach Loki
      # through the tunnel (its tailscaled is userspace-mode, so the NAS has no
      # tailnet egress at all). Nothing on the LAN can see this.
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki_yml
        target: /etc/loki/loki.yml
    networks:
      - monitoring
    # No healthcheck. The image is distroless -- no shell, no wget, no curl, not
    # even busybox -- so a `test:` of any shape exits -1 and marks a perfectly
    # healthy Loki unhealthy forever. Prometheus scrapes its /metrics instead,
    # which is better monitoring than a container flag anyway: `up{job="loki"}`
    # and the LokiDown alert say the same thing and are visible from the
    # dashboard.

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: homelab-alloy
    restart: unless-stopped
    depends_on:
      - loki
    # Root for two reasons: the journal files are root:systemd-journal, and the
    # Docker socket is root:docker. Promtail would have done this job but went
    # end-of-life on 2 March 2026.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.1
    container_name: homelab-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the Dokploy Environment tab}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/homelab-overview.json
      # Set GRAFANA_ROOT_URL once a domain fronts this, otherwise redirects,
      # share links and alert links all point at localhost:3001.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # Cloudflare and Traefik both sit in front, so trust the forwarded headers.
      GF_SERVER_ROUTER_LOGGING: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: lax
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasource_yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider_yml
        target: /etc/grafana/provisioning/dashboards/homelab.yml
      - source: grafana_dashboard_overview_json
        target: /var/lib/grafana/dashboards/homelab-overview.json
      - source: grafana_dashboard_logs_json
        target: /var/lib/grafana/dashboards/homelab-logs.json
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  monitoring:
    driver: bridge

configs:
  prometheus_yml:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        external_labels:
          host: debian

      rule_files:
        - /etc/prometheus/rules/*.yml

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: node
          static_configs:
            - targets: ["host.docker.internal:9100"]
              labels:
                instance: homelab

        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
              labels:
                instance: homelab

        # NOUS A1T smart plug (Tasmota) feeding the box, via json-exporter.
        # The plug is DHCP-reserved at 192.168.15.132 on the Fritz!Box.
        - job_name: smartplug
          metrics_path: /probe
          scrape_interval: 15s
          scrape_timeout: 10s
          params:
            module: [tasmota]
          static_configs:
            - targets: ["http://192.168.15.132/cm?cmnd=Status%2010"]
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - target_label: instance
              replacement: homelab
            - target_label: __address__
              replacement: json-exporter:7979

        - job_name: qbittorrent
          static_configs:
            - targets: ["qbittorrent-exporter:8000"]
              labels:
                instance: homelab

        - job_name: alloy
          static_configs:
            - targets: ["alloy:12345"]
              labels:
                instance: homelab

        - job_name: loki
          static_configs:
            - targets: ["loki:3100"]
              labels:
                instance: homelab

        # The NAS (UGREEN DXP4800 Pro) is on someone else's network and is only
        # reachable over Tailscale — its LAN address does not answer from here,
        # and the path is DERP-relayed at 35-80ms with no direct connection, so
        # these two jobs scrape four times slower than the local ones and allow
        # a much longer timeout. ${NAS_TAILNET_IP} is a tailnet address, which is
        # stable, so this is the one place the no-hard-coded-IP rule does not
        # apply.
        - job_name: node-nas
          scrape_interval: 60s
          scrape_timeout: 20s
          static_configs:
            - targets: ["${NAS_TAILNET_IP}:9100"]
              labels:
                instance: nas

        - job_name: cadvisor-nas
          scrape_interval: 60s
          scrape_timeout: 20s
          static_configs:
            - targets: ["${NAS_TAILNET_IP}:8081"]
              labels:
                instance: nas

  prometheus_rules_yml:
    content: |
      # Power for the GMKtec M6 Ultra (Ryzen 5 7640HS).
      #
      # Real wall watts now come from a NOUS A1T metering plug (Tasmota) that the
      # box is plugged into, scraped through json-exporter. The old model is kept
      # as :model and used as a fallback whenever the plug is unreachable, so the
      # dashboard never goes blank.
      #
      # The model exists because the only power sensor this board exposes is the
      # amdgpu PPT rail — CPU cores and iGPU only. It does NOT see the NVMe
      # drive, the DIMMs, the 2.5G NIC, the fan, the board, or the loss in the
      # external power brick, so it reads well below actual wall draw.
      #   PLATFORM_OFFSET  10 W  — NVMe idle ~1.5, 2x DDR5 SODIMM ~3,
      #                            RTL8125B at 2.5G ~1.5, fan ~1, board ~3
      #   PSU_EFFICIENCY   0.89  — typical external 19V brick under light load
      groups:
        - name: homelab-power
          interval: 15s
          rules:
            - record: homelab:power_package_watts
              expr: |
                node_hwmon_power_watt
                  * on(instance, chip) group_left(chip_name)
                node_hwmon_chip_names{chip_name="amdgpu"}

            - record: homelab:power_package_watts:avg
              expr: |
                node_hwmon_power_average_watt
                  * on(instance, chip) group_left(chip_name)
                node_hwmon_chip_names{chip_name="amdgpu"}

            - record: homelab:power_wall_watts:model
              expr: (homelab:power_package_watts + 10) / 0.89

            # Measured first, model second. `or` only evaluates the right side
            # when the left has no series, i.e. when the plug scrape is failing.
            # Both sides are reduced to a bare instance="homelab" label set so
            # the recorded series does not change shape when it switches source.
            - record: homelab:power_wall_watts:estimate
              expr: |
                max by (instance) (tasmota_active_power_watts{job="smartplug"})
                  or
                max by (instance) (homelab:power_wall_watts:model)

            - record: homelab:energy_total_kwh
              expr: max by (instance) (tasmota_energy_total_kilowatt_hours{job="smartplug"})

        - name: homelab-alerts
          interval: 30s
          rules:
            - alert: HostDown
              expr: up{job="node"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: node_exporter unreachable — the box may be down or asleep again

            - alert: EthernetLinkFlapping
              expr: changes(node_network_up{device="enp3s0"}[15m]) > 2
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: enp3s0 link flapped more than twice in 15 minutes

            - alert: EthernetErrors
              expr: rate(node_network_receive_errs_total{device="enp3s0"}[10m]) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: enp3s0 is logging receive errors

            # instance is pinned on these two from here on: node metrics now
            # arrive from the NAS as well, and an unscoped expression would fire
            # this rule for the wrong machine with the wrong summary.
            - alert: MemoryPressure
              expr: |
                (1 - node_memory_MemAvailable_bytes{instance="homelab"}
                   / node_memory_MemTotal_bytes{instance="homelab"}) > 0.90
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: less than 10% of RAM available for 15 minutes

            - alert: DiskFillingUp
              expr: |
                node_filesystem_avail_bytes{instance="homelab",mountpoint="/"}
                  / node_filesystem_size_bytes{instance="homelab",mountpoint="/"} < 0.10
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: root filesystem is over 90% full

            - alert: LokiDown
              expr: up{job="loki"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: Loki is not answering — logs are not being stored

            - alert: SmartPlugDown
              expr: up{job="smartplug"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: smart plug unreachable — wall power has fallen back to the model

            - alert: CPUHot
              expr: |
                node_hwmon_temp_celsius
                  * on(chip) group_left(chip_name)
                node_hwmon_chip_names{chip_name="k10temp"} > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: CPU die sustained above 90C

        # The NAS is not on a metering plug, so Intel RAPL is the only power
        # signal it has -- CPU package and cores, nothing for the disk or the
        # board. A 5m window because that job scrapes every 60s.
        - name: nas-power
          interval: 60s
          rules:
            - record: nas:power_package_watts
              expr: rate(node_rapl_package_joules_total{instance="nas"}[5m])
            - record: nas:power_core_watts
              expr: rate(node_rapl_core_joules_total{instance="nas"}[5m])

        # Every one of these arrives over a DERP-relayed tailnet hop, so NasDown
        # waits 10 minutes: a relay hiccup is not an outage.
        - name: nas-alerts
          interval: 30s
          rules:
            - alert: NasDown
              expr: up{job="node-nas"} == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: NAS node_exporter unreachable over the tailnet for 10 minutes

            - alert: NasPoolFillingUp
              expr: |
                node_filesystem_avail_bytes{instance="nas",mountpoint="/volume1"}
                  / node_filesystem_size_bytes{instance="nas",mountpoint="/volume1"} < 0.10
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: NAS /volume1 is over 90% full

            - alert: NasRaidDegraded
              expr: node_md_disks{instance="nas",state="active"} < node_md_disks_required
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: NAS md array has fewer active disks than it requires

            - alert: NasDiskHot
              expr: max(node_hwmon_temp_celsius{instance="nas"}) > 60
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: NAS sensor sustained above 60C

  json_exporter_yml:
    content: |
      # Maps the Tasmota ENERGY object onto Prometheus metrics.
      # Sample payload: {"StatusSNS":{"ENERGY":{"Power":21,"Voltage":230,...}}}
      modules:
        tasmota:
          metrics:
            - name: tasmota
              help: Tasmota ENERGY sensor reading from the smart plug
              type: object
              path: '{ .StatusSNS.ENERGY }'
              values:
                active_power_watts: '{.Power}'
                apparent_power_voltamperes: '{.ApparentPower}'
                power_factor_ratio: '{.Factor}'
                voltage_volts: '{.Voltage}'
                current_amperes: '{.Current}'
                energy_today_kilowatt_hours: '{.Today}'
                energy_total_kilowatt_hours: '{.Total}'

  grafana_datasource_yml:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          jsonData:
            timeInterval: 15s
            httpMethod: POST
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
          jsonData:
            # Alloy writes `level` as a stream label, so Grafana can colour rows
            # without having to derive the level from the line itself.
            derivedFields: []

  grafana_dashboard_provider_yml:
    content: |
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false

  loki_yml:
    content: |
      # Single-binary Loki on local disk. No object store, no ring beyond one
      # member: this is one box with 297G free, not a cluster.
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096
        # Loki is chatty at info and its own logs would end up in itself.
        log_level: warn

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2026-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        # 30 days, against Prometheus's 180. Logs are an order of magnitude
        # bulkier per day and are read while the question is still fresh.
        retention_period: 720h
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        # Forty containers plus the journal is a lot of streams for the default
        # per-tenant caps, and there is only one tenant.
        max_streams_per_user: 0
        max_global_streams_per_user: 0
        allow_structured_metadata: true
        volume_enabled: true
        reject_old_samples: true
        reject_old_samples_max_age: 168h

      compactor:
        working_directory: /loki/compactor
        # Without this, retention_period above is inert and the disk just grows.
        retention_enabled: true
        delete_request_store: filesystem
        compaction_interval: 10m

      ruler:
        storage:
          type: local
          local:
            directory: /loki/rules

      analytics:
        reporting_enabled: false

  alloy_config:
    content: |
      // Log collection for the mini PC: every Docker container plus the host's
      // systemd journal, shipped to Loki next door. Promtail's replacement --
      // Promtail reached end-of-life on 2 March 2026.
      logging {
        level  = "warn"
        format = "logfmt"
      }

      discovery.docker "containers" {
        host             = "unix:///var/run/docker.sock"
        refresh_interval = "15s"
      }

      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        // Docker reports names with a leading slash.
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          target_label  = "compose_project"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "compose_service"
        }
        rule {
          target_label = "job"
          replacement  = "docker"
        }
      }

      loki.source.docker "containers" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.containers.output
        labels     = { host = "homelab" }
        forward_to = [loki.write.local.receiver]
      }

      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
        rule {
          source_labels = ["__journal_syslog_identifier"]
          target_label  = "identifier"
        }
        // loki.source.journal defaults job to its own component path
        // ("loki.source.journal.host") and that default beats the `labels`
        // argument. Relabelling runs afterwards, so this is where job is won.
        rule {
          target_label = "job"
          replacement  = "journal"
        }
      }

      loki.source.journal "host" {
        path          = "/var/log/journal"
        // A restart should backfill half a day, not the whole persistent journal.
        max_age       = "12h"
        relabel_rules = loki.relabel.journal.rules
        labels        = { host = "homelab" }
        forward_to    = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

  grafana_dashboard_overview_json:
    content: |
__DASHBOARD_OVERVIEW__

  grafana_dashboard_logs_json:
    content: |
__DASHBOARD_LOGS__
