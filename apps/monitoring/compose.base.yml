# Homelab monitoring stack — Prometheus + Grafana + node_exporter + cAdvisor.
#
# GENERATED FILE when built as docker-compose.yml — edit compose.base.yml and
# dashboards/*.json, then run ./build.py.
#
# Everything is inlined as compose `configs`, so docker-compose.yml is fully
# self-contained: paste it into Dokploy as a Raw compose app, no side files.
#
# Environment (set in the Dokploy Environment tab):
#   GRAFANA_ADMIN_PASSWORD  required
#   GRAFANA_ROOT_URL        optional, e.g. https://grafana.davideghiotto.it
#   GRAFANA_COOKIE_SECURE   optional, set true once served over HTTPS

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: homelab-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=30GB
      - --web.enable-lifecycle
    extra_hosts:
      # node_exporter runs on the host network, so reach it via the bridge gateway.
      - host.docker.internal:host-gateway
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_yml
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules_yml
        target: /etc/prometheus/rules/homelab.rules.yml
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: homelab-node-exporter
    restart: unless-stopped
    # Host network + host PID so interface, process and sensor metrics are the
    # host's own, not the container's. Root is required to read the hwmon and
    # powercap sensor files.
    network_mode: host
    pid: host
    user: root
    command:
      - --path.rootfs=/host
      - --collector.hwmon
      - --collector.rapl
      - --collector.systemd
      - --collector.processes
      - --collector.netdev.device-exclude=^(veth|docker|br-|lo).*$$
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: homelab-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  json-exporter:
    image: prometheuscommunity/json-exporter:v0.8.0
    container_name: homelab-json-exporter
    restart: unless-stopped
    # Bridges the Tasmota smart plug into Prometheus. The plug speaks JSON over
    # HTTP (/cm?cmnd=Status 10) and has no /metrics of its own, so this maps its
    # ENERGY object onto metrics. Prometheus scrapes this, not the plug.
    command:
      - --config.file=/config.yml
    configs:
      - source: json_exporter_yml
        target: /config.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.1
    container_name: homelab-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the Dokploy Environment tab}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/homelab-overview.json
      # Set GRAFANA_ROOT_URL once a domain fronts this, otherwise redirects,
      # share links and alert links all point at localhost:3001.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # Cloudflare and Traefik both sit in front, so trust the forwarded headers.
      GF_SERVER_ROUTER_LOGGING: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: lax
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasource_yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider_yml
        target: /etc/grafana/provisioning/dashboards/homelab.yml
      - source: grafana_dashboard_overview_json
        target: /var/lib/grafana/dashboards/homelab-overview.json
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge

configs:
  prometheus_yml:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
        external_labels:
          host: debian

      rule_files:
        - /etc/prometheus/rules/*.yml

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: node
          static_configs:
            - targets: ["host.docker.internal:9100"]
              labels:
                instance: homelab

        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
              labels:
                instance: homelab

        # NOUS A1T smart plug (Tasmota) feeding the box, via json-exporter.
        # The plug is DHCP-reserved at 192.168.15.132 on the Fritz!Box.
        - job_name: smartplug
          metrics_path: /probe
          scrape_interval: 15s
          scrape_timeout: 10s
          params:
            module: [tasmota]
          static_configs:
            - targets: ["http://192.168.15.132/cm?cmnd=Status%2010"]
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - target_label: instance
              replacement: homelab
            - target_label: __address__
              replacement: json-exporter:7979

  prometheus_rules_yml:
    content: |
      # Power for the GMKtec M6 Ultra (Ryzen 5 7640HS).
      #
      # Real wall watts now come from a NOUS A1T metering plug (Tasmota) that the
      # box is plugged into, scraped through json-exporter. The old model is kept
      # as :model and used as a fallback whenever the plug is unreachable, so the
      # dashboard never goes blank.
      #
      # The model exists because the only power sensor this board exposes is the
      # amdgpu PPT rail — CPU cores and iGPU only. It does NOT see the NVMe
      # drive, the DIMMs, the 2.5G NIC, the fan, the board, or the loss in the
      # external power brick, so it reads well below actual wall draw.
      #   PLATFORM_OFFSET  10 W  — NVMe idle ~1.5, 2x DDR5 SODIMM ~3,
      #                            RTL8125B at 2.5G ~1.5, fan ~1, board ~3
      #   PSU_EFFICIENCY   0.89  — typical external 19V brick under light load
      groups:
        - name: homelab-power
          interval: 15s
          rules:
            - record: homelab:power_package_watts
              expr: |
                node_hwmon_power_watt
                  * on(instance, chip) group_left(chip_name)
                node_hwmon_chip_names{chip_name="amdgpu"}

            - record: homelab:power_package_watts:avg
              expr: |
                node_hwmon_power_average_watt
                  * on(instance, chip) group_left(chip_name)
                node_hwmon_chip_names{chip_name="amdgpu"}

            - record: homelab:power_wall_watts:model
              expr: (homelab:power_package_watts + 10) / 0.89

            # Measured first, model second. `or` only evaluates the right side
            # when the left has no series, i.e. when the plug scrape is failing.
            # Both sides are reduced to a bare instance="homelab" label set so
            # the recorded series does not change shape when it switches source.
            - record: homelab:power_wall_watts:estimate
              expr: |
                max by (instance) (tasmota_active_power_watts{job="smartplug"})
                  or
                max by (instance) (homelab:power_wall_watts:model)

            - record: homelab:energy_total_kwh
              expr: max by (instance) (tasmota_energy_total_kilowatt_hours{job="smartplug"})

        - name: homelab-alerts
          interval: 30s
          rules:
            - alert: HostDown
              expr: up{job="node"} == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: node_exporter unreachable — the box may be down or asleep again

            - alert: EthernetLinkFlapping
              expr: changes(node_network_up{device="enp3s0"}[15m]) > 2
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: enp3s0 link flapped more than twice in 15 minutes

            - alert: EthernetErrors
              expr: rate(node_network_receive_errs_total{device="enp3s0"}[10m]) > 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: enp3s0 is logging receive errors

            - alert: MemoryPressure
              expr: |
                (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: less than 10% of RAM available for 15 minutes

            - alert: DiskFillingUp
              expr: |
                node_filesystem_avail_bytes{mountpoint="/"}
                  / node_filesystem_size_bytes{mountpoint="/"} < 0.10
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: root filesystem is over 90% full

            - alert: SmartPlugDown
              expr: up{job="smartplug"} == 0
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: smart plug unreachable — wall power has fallen back to the model

            - alert: CPUHot
              expr: |
                node_hwmon_temp_celsius
                  * on(chip) group_left(chip_name)
                node_hwmon_chip_names{chip_name="k10temp"} > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: CPU die sustained above 90C

  json_exporter_yml:
    content: |
      # Maps the Tasmota ENERGY object onto Prometheus metrics.
      # Sample payload: {"StatusSNS":{"ENERGY":{"Power":21,"Voltage":230,...}}}
      modules:
        tasmota:
          metrics:
            - name: tasmota
              help: Tasmota ENERGY sensor reading from the smart plug
              type: object
              path: '{ .StatusSNS.ENERGY }'
              values:
                active_power_watts: '{.Power}'
                apparent_power_voltamperes: '{.ApparentPower}'
                power_factor_ratio: '{.Factor}'
                voltage_volts: '{.Voltage}'
                current_amperes: '{.Current}'
                energy_today_kilowatt_hours: '{.Today}'
                energy_total_kilowatt_hours: '{.Total}'

  grafana_datasource_yml:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          jsonData:
            timeInterval: 15s
            httpMethod: POST

  grafana_dashboard_provider_yml:
    content: |
      apiVersion: 1
      providers:
        - name: homelab
          orgId: 1
          type: file
          disableDeletion: false
          updateIntervalSeconds: 30
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false

  grafana_dashboard_overview_json:
    content: |
__DASHBOARD_OVERVIEW__
