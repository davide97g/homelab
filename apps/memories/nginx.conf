# Immich cannot live under a subpath on its own (no base-path setting), so the
# prefix is stripped here. The mobile app is fine with that: it reads
# <server>/.well-known/immich, gets {"api":{"endpoint":"/api"}}, and appends it
# to whatever it was given -- /immich/api, socket.io at /immich/api/socket.io.

map $http_upgrade $proxy_connection {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Resolve immich_server per request via Docker's DNS. A literal upstream is
  # resolved once at boot, and every Immich restart (new container IP) turned
  # into 502s until this proxy was restarted too (2026-11-21).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $immich_upstream ${IMMICH_UPSTREAM};

  # Uploads: originals and videos stream straight through. Note the edge in
  # front caps one request at 100 MB on Cloudflare's free plan -- see README.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  send_timeout 600s;

  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $proxy_connection;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-Proto https;

  location = /immich {
    return 301 /immich/;
  }

  # Native apps: strip /immich (with a variable upstream, proxy_pass can't
  # strip a prefix itself; rewrite keeps the query string).
  location ^~ /immich/ {
    rewrite ^/immich(/.*)$ $1 break;
    proxy_pass $immich_upstream;
  }

  location / {
    proxy_pass $immich_upstream;
  }
}
