# Immich cannot live under a subpath on its own (no base-path setting), so the
# prefix is stripped here. The mobile app is fine with that: it reads
# <server>/.well-known/immich, gets {"api":{"endpoint":"/api"}}, and appends it
# to whatever it was given -- /immich/api, socket.io at /immich/api/socket.io.

map $http_upgrade $proxy_connection {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Resolve immich_server per request via Docker's DNS. A literal upstream is
  # resolved once at boot, and every Immich restart (new container IP) turned
  # into 502s until this proxy was restarted too (2026-11-21).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $immich_upstream ${IMMICH_UPSTREAM};

  # Uploads: originals and videos stream straight through. Note the edge in
  # front caps one request at 100 MB on Cloudflare's free plan -- see README.
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  send_timeout 600s;

  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $proxy_connection;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  proxy_set_header X-Forwarded-Proto https;

  location = /immich {
    return 301 /immich/;
  }

  # Chunked uploads for files over Cloudflare's 100 MB cap -> memories-upload (relay.py),
  # which reassembles them and posts to Immich. Pieces are buffered here so the relay always
  # gets a Content-Length, whatever the tunnel sends.
  location ^~ /immich/api/memories/upload/ {
    set $relay_upstream ${RELAY_UPSTREAM};
    client_max_body_size 100m;
    proxy_request_buffering on;
    proxy_pass $relay_upstream;
  }

  # Search with a sentence -> memories-search (search/search.py). Both prefixes: the native
  # apps use /immich/api, the web app same-origin /api.
  # (Prefix locations with ^~: a regex would never win over `^~ /immich/` below.)
  location ^~ /immich/api/memories/search {
    set $search_upstream ${SEARCH_UPSTREAM};
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    proxy_pass $search_upstream;
  }
  location ^~ /api/memories/search {
    set $search_upstream ${SEARCH_UPSTREAM};
    client_max_body_size 64k;
    proxy_read_timeout 60s;
    proxy_pass $search_upstream;
  }

  # Native apps: strip /immich (with a variable upstream, proxy_pass can't
  # strip a prefix itself; rewrite keeps the query string).
  location ^~ /immich/ {
    rewrite ^/immich(/.*)$ $1 break;
    proxy_pass $immich_upstream;
  }

  location / {
    proxy_pass $immich_upstream;
  }
}
