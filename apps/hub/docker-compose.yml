# What runs on the box. Dokploy deploys it from davide97g/homelab on every push to
# main (.github/workflows/hub.yml): it clones the repo and runs `up -d --build`
# here, so the image is built on the box from this directory -- there is no
# registry in this setup.
#
# One container, one origin, one port: the server serves both /api and the built
# page, so there is no CORS to configure, the session cookie is same-origin by
# construction, and the Cloudflare Tunnel has exactly one thing to point at.

services:
  hub:
    build: .
    image: ${HUB_IMAGE:-homelab-hub:latest}
    container_name: homelab-hub
    restart: unless-stopped
    # Dokploy writes its Environment tab to .env beside this file. In the
    # fallback deploy (deploy.py --direct) it is ~/hub/.env on the box instead.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      # Never a LAN IP: the box is on DHCP and a new lease has already broken
      # every baked-in address once. host-gateway resolves the box from inside
      # this container whatever address it holds today.
      HOMELAB_HOST: ${HOMELAB_HOST:-homelab-host}
      HOMELAB_PUBLIC_HOST: ${HOMELAB_PUBLIC_HOST:-debian}
      # Reachable only because this container joins the monitoring network below.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      # The Docker API, and note what is *not* here: no /var/run/docker.sock
      # mount. See the proxy below.
      DOCKER_HOST: ${DOCKER_HOST:-tcp://hub-docker-proxy:2375}
      AUDIT_PATH: /data/actions.jsonl
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Europe/Rome}
    extra_hosts:
      - homelab-host:host-gateway
    ports:
      # 3000 is Dokploy, 3001 Grafana, 3002 mediarr-dash.
      - "${HUB_PORT:-3003}:8080"
    volumes:
      # The action audit. A named volume rather than a bind, and deliberately not
      # inside the source tree: deploy.py clears the directories it owns on every
      # sync, and an audit log a deploy erases is a log of the last five minutes.
      - hub-data:/data
    networks:
      - monitoring
      - docker-proxy
    depends_on:
      - docker-proxy

  # The only thing on the box with the Docker socket.
  #
  # `:ro` on a socket mount does not make the Docker API read-only. It applies to
  # the file node, not the protocol: POST /containers/x/stop works through one,
  # and so does POST /containers/create with Binds: ["/:/host"], which is root on
  # the box. So the hub gets a filtered HTTP API instead and no socket at all.
  #
  # This is wollomatic/socket-proxy rather than the more common
  # tecnativa/docker-socket-proxy, and the difference matters. Tecnativa filters
  # by *resource*: CONTAINERS=1 with POST=1 allows every POST and DELETE under
  # /containers — which is `create` (with any bind mount, so root on the host),
  # `exec`, `kill` and `remove`, not just the three verbs wanted here. Measured,
  # not assumed: against that config `POST /containers/{id}/exec` answered 201
  # and `POST /containers/create` reached the daemon. Its ALLOW_START and
  # ALLOW_RESTARTS variables do not help, because the rule above them denies
  # every non-GET unless POST is set, so they are unreachable.
  #
  # This one filters by method *and* path regex, so the allow-list below is the
  # literal set of requests the hub can make. Everything else is 403, including
  # path traversal out of /containers.
  docker-proxy:
    image: wollomatic/socket-proxy:1
    container_name: hub-docker-proxy
    restart: unless-stopped
    # The image runs as nobody and cannot read the socket without the host's
    # docker group. That gid is host-specific -- `getent group docker | cut -d: -f3`
    # -- so it comes from DOCKER_GID in the Dokploy Environment tab.
    user: "65534:${DOCKER_GID:-989}"
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      # Resolved at request time against the source address, so only the hub can
      # reach this even though the network is shared.
      - -allowfrom=homelab-hub
      # Everything the containers page reads. Note what is not here: no /images,
      # no /volumes, no /networks, no /events, no /exec.
      - -allowGET=/(v[0-9.]+/)?(version|info|_ping|containers/json|containers/[a-zA-Z0-9_.-]+/json)
      # Everything the actions layer writes. Three verbs, on one container each.
      # `kill` is deliberately absent: the dispatcher offers a graceful stop, and
      # a path that skips the grace period is not one the hub should be able to
      # take by accident.
      - -allowPOST=/(v[0-9.]+/)?containers/[a-zA-Z0-9_.-]+/(start|stop|restart)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    # No healthcheck, deliberately. This image is distroless -- no shell, no
    # curl, not even an `ls` -- so a compose healthcheck of any shape exits -1
    # and marks a perfectly healthy proxy unhealthy forever. That is exactly what
    # happened to Loki in the monitoring stack, for 110 consecutive checks while
    # it served reads and writes fine. The binary's own -allowhealthcheck only
    # permits an *external* HEAD to :55555/health, which nothing here does.
    # Whether the proxy is working is visible where it matters: /api/containers
    # reports source "cadvisor" instead of "docker" the moment it is not.

# Pinned to the names these volumes got under plain `docker compose` (project
# `hub`). Dokploy runs this under its own app name, which would otherwise
# prefix every volume differently and start the stack on empty ones.
volumes:
  hub-data:
    name: hub_hub-data

networks:
  # Created by the monitoring stack, and the name carries Dokploy's app slug, so
  # it changes if that app is ever renamed. `docker network ls | grep monitoring`
  # and set MONITORING_NETWORK if this stops resolving.
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring-frontend-fnhjyi_monitoring}

  # internal: true means no gateway and no route off the box. The proxy holds the
  # most dangerous handle on the machine; it has no business being reachable from
  # anywhere except the one container that needs it.
  docker-proxy:
    internal: true
