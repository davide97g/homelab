<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0A1F">
<meta name="robots" content="noindex">
<title>La Camera dei Segreti · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0A1F;
    --night: #151338;
    --velvet: #241F5C;
    --gold: #F2C46D;
    --gold-hi: #FFE7A8;
    --gold-dim: #8C6A2E;
    --rose: #FF4FA3;
    --ice: #9FD8FF;
    --text: #F4EEDD;
    --muted: #B3A9CF;
    --right: #5BE39A;
    --wrong: #FF6B6B;
    --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
    --body: 'Cormorant Garamond', Georgia, serif;
    --card-w: min(78vw, 46vh, 360px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--velvet) 0%, var(--night) 45%, var(--ink) 100%) fixed;
    color: var(--text);
    font: 500 19px/1.4 var(--body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { position: relative; z-index: 1; min-height: 100%; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ── intro ─────────────────────────────────────────────────────────── */
  #intro { min-height: calc(100vh - 40px); display: grid; place-items: center; text-align: center; }
  .seal {
    font-family: var(--display); letter-spacing: .3em; text-transform: uppercase;
    font-size: 12px; color: var(--gold); opacity: .8;
  }
  .hello { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 9vw, 46px); margin: 14px 0 6px; line-height: 1.1;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-dim)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--muted); font-style: italic; font-size: 20px; max-width: 30ch; margin: 0 auto 34px; }
  .wand {
    position: relative; border: 0; cursor: pointer; padding: 18px 30px; border-radius: 999px;
    font-family: var(--display); font-weight: 700; letter-spacing: .14em; font-size: 15px; text-transform: uppercase;
    color: var(--ink); background: linear-gradient(180deg, var(--gold-hi), var(--gold));
    box-shadow: 0 0 0 1px #fff4 inset, 0 10px 40px -8px #F2C46Daa, 0 0 80px -10px #F2C46D66;
    animation: breathe 2.6s ease-in-out infinite;
  }
  .wand:active { transform: scale(.97); }
  @keyframes breathe { 50% { box-shadow: 0 0 0 1px #fff4 inset, 0 10px 50px -4px #F2C46Dcc, 0 0 120px 0 #F2C46D88; } }

  /* ── the card ──────────────────────────────────────────────────────── */
  #reveal { min-height: calc(100vh - 40px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .stage { position: relative; width: var(--card-w); aspect-ratio: 1260 / 1760; perspective: 1400px; margin-bottom: 26px; }
  .ring {
    position: absolute; left: 50%; top: 50%; width: 170%; aspect-ratio: 1; translate: -50% -50%;
    opacity: 0; pointer-events: none;
  }
  .ring svg { width: 100%; height: 100%; animation: spin 40s linear infinite; }
  .ring.on { opacity: .55; transition: opacity 1.4s ease .3s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .float { position: absolute; inset: 0; transform-style: preserve-3d; }
  .float.on { animation: levitate 5s ease-in-out infinite; }
  @keyframes levitate { 50% { transform: translateY(-10px); } }
  .tilt { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .25s ease-out; }
  .card {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transform: scale(.05) rotateY(-540deg) rotateZ(-30deg); opacity: 0;
  }
  .card.arrive { animation: arrive 1.5s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes arrive {
    0% { transform: scale(.05) rotateY(-540deg) rotateZ(-30deg); opacity: 0; filter: brightness(4); }
    60% { opacity: 1; filter: brightness(1.4); }
    100% { transform: scale(1) rotateY(0deg) rotateZ(0); opacity: 1; filter: brightness(1); }
  }
  .card.flip { animation: flip 1.1s cubic-bezier(.5,0,.2,1) forwards; }
  @keyframes flip {
    0% { transform: rotateY(0); }
    45% { transform: rotateY(100deg) scale(1.08); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.done { transform: rotateY(180deg); opacity: 1; }
  .face {
    position: absolute; inset: 0; border-radius: 4.5% / 3.2%; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 30px 60px -20px #000c, 0 0 0 1px #F2C46D55;
  }
  .back {
    background:
      radial-gradient(60% 45% at 50% 50%, #3A2F8A 0%, transparent 70%),
      repeating-conic-gradient(from 0deg at 50% 50%, #1B1747 0 6deg, #211C55 6deg 12deg);
    display: grid; place-items: center;
  }
  .back::before {
    content: ''; position: absolute; inset: 5%; border-radius: 3.5% / 2.5%;
    border: 2px solid var(--gold); box-shadow: 0 0 0 5px #0B0A1F, 0 0 0 6px var(--gold-dim), inset 0 0 30px #F2C46D33;
  }
  .back svg { width: 54%; filter: drop-shadow(0 0 14px #F2C46Daa); }
  .front { transform: rotateY(180deg); background: var(--ink); }
  .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .front .noimg { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 64px; color: var(--gold); background: radial-gradient(circle, #3A2F8A, #0B0A1F); }
  .sheen {
    position: absolute; inset: -50%; pointer-events: none; mix-blend-mode: color-dodge; opacity: .0;
    background: linear-gradient(105deg, transparent 40%, #ffffff55 47%, #FFE7A8aa 50%, #9FD8FF66 53%, transparent 60%);
    transform: translateX(-60%);
  }
  .sheen.go { animation: sweep 1.6s ease-in-out .15s 1 forwards; }
  @keyframes sweep { 0% { opacity: 0; transform: translateX(-60%); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateX(60%); } }
  .holo {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .35;
    background: radial-gradient(circle at var(--hx, 50%) var(--hy, 30%), #ffffffaa, transparent 45%),
                linear-gradient(125deg, #FF4FA322, #9FD8FF22 40%, #F2C46D22 70%, #FF4FA322);
  }
  .flash { position: fixed; inset: 0; background: radial-gradient(circle, #FFF6D8 0%, #F2C46D88 30%, transparent 70%); opacity: 0; pointer-events: none; z-index: 5; }
  .flash.go { animation: flash .9s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

  .card-title { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 7.5vw, 34px); letter-spacing: .12em; min-height: 1.3em; margin: 0;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-dim)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px #F2C46D66); }
  .card-title span { opacity: 0; display: inline-block; transform: translateY(8px); filter: blur(6px); transition: all .5s ease; }
  .card-title span.in { opacity: 1; transform: none; filter: none; }
  .card-name { font-style: italic; font-size: 22px; color: var(--muted); margin: 6px 0 26px; opacity: 0; transition: opacity 1s ease; }
  .card-name.in { opacity: 1; }
  #enter { opacity: 0; transition: opacity .8s ease; pointer-events: none; }
  #enter.in { opacity: 1; pointer-events: auto; }

  /* ── game ──────────────────────────────────────────────────────────── */
  #game { max-width: 560px; margin: 0 auto; }
  .me { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #ffffff0a; border: 1px solid #F2C46D33; }
  .me img, .me .ph { width: 46px; height: 64px; border-radius: 6px; object-fit: cover; box-shadow: 0 0 0 1px #F2C46D66, 0 0 18px #F2C46D33; cursor: pointer; background: var(--velvet); }
  .me .who { flex: 1; min-width: 0; }
  .me .t { font-family: var(--display); font-size: 11px; letter-spacing: .2em; color: var(--gold); }
  .me .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .me .pts { text-align: right; font-family: var(--display); }
  .me .pts b { display: block; font-size: 26px; color: var(--gold-hi); line-height: 1; }
  .me .pts small { font-size: 11px; letter-spacing: .14em; color: var(--muted); }

  .panel { margin-top: 16px; padding: 20px 18px; border-radius: 20px; background: linear-gradient(180deg, #ffffff0d, #ffffff05); border: 1px solid #ffffff14; backdrop-filter: blur(6px); }
  .kicker { font-family: var(--display); font-size: 12px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .q { font-size: 25px; font-weight: 700; line-height: 1.2; margin: 8px 0 18px; text-wrap: balance; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    padding: 14px 14px; border-radius: 14px; border: 1px solid #F2C46D44; background: #0B0A1F88; font-size: 20px; line-height: 1.2;
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
  }
  .opt:active { transform: scale(.98); }
  .opt .l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--ink); background: var(--gold); }
  .opt.picked { background: #F2C46D26; border-color: var(--gold); }
  .opt.right { background: #5BE39A22; border-color: var(--right); }
  .opt.right .l { background: var(--right); }
  .opt.wrong { background: #FF6B6B22; border-color: var(--wrong); }
  .opt.wrong .l { background: var(--wrong); }
  .opt[disabled] { cursor: default; }
  .opts.locked .opt:not(.picked):not(.right):not(.wrong) { opacity: .45; }
  .text-row { display: flex; gap: 8px; }
  .text-row input { flex: 1; min-width: 0; font: inherit; font-size: 20px; color: var(--text); padding: 13px 14px; border-radius: 14px; border: 1px solid #F2C46D55; background: #0B0A1F99; outline: none; }
  .text-row input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px #F2C46D33; }
  .go { border: 0; border-radius: 14px; padding: 0 18px; font-family: var(--display); font-weight: 700; letter-spacing: .08em; background: var(--gold); color: var(--ink); cursor: pointer; }
  .go:disabled { opacity: .5; }
  .timer { height: 4px; border-radius: 4px; background: #ffffff14; overflow: hidden; margin: -6px 0 16px; }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); transform-origin: left; }
  .sent { margin-top: 14px; color: var(--muted); font-style: italic; }
  .sent b { color: var(--gold-hi); font-style: normal; }
  .faces { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .face-chip { position: relative; width: 38px; height: 52px; border-radius: 6px; overflow: hidden; background: var(--velvet); opacity: .3; filter: grayscale(1); transition: all .4s ease; }
  .face-chip img { position: relative; width: 100%; height: 100%; object-fit: cover; }
  .face-chip.on { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--gold), 0 0 14px #F2C46D88; transform: translateY(-2px); }
  .face-chip .ini { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; }

  .verdict { text-align: center; padding: 6px 0 14px; }
  .verdict .big { font-family: var(--display); font-weight: 900; font-size: 40px; letter-spacing: .06em; }
  .verdict.ok .big { color: var(--right); text-shadow: 0 0 30px #5BE39A88; }
  .verdict.ko .big { color: var(--wrong); text-shadow: 0 0 30px #FF6B6B66; }
  .verdict.none .big { color: var(--muted); }
  .verdict .plus { font-family: var(--display); font-size: 22px; color: var(--gold-hi); }
  .answer-line { font-size: 20px; margin: 10px 0 4px; }
  .answer-line b { color: var(--gold-hi); }
  .explain { color: var(--muted); font-style: italic; font-size: 18px; }

  .board { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: #ffffff08; border: 1px solid transparent; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .row.me-row { border-color: #F2C46D66; background: #F2C46D14; }
  .row .pos { width: 26px; text-align: center; font-family: var(--display); font-weight: 900; color: var(--muted); }
  .row:first-child .pos { color: var(--gold-hi); }
  .row img, .row .ph { width: 34px; height: 47px; border-radius: 5px; object-fit: cover; background: var(--velvet); flex: none; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; }
  .row .nm small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm b { display: block; font-size: 19px; line-height: 1.1; }
  .row .nm small { font-family: var(--display); font-size: 10px; letter-spacing: .16em; color: var(--muted); }
  .row .said { display: block; font-size: 15px; color: var(--muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .said.r { color: var(--right); } .row .said.w { color: var(--wrong); }
  .row .sc { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--gold-hi); min-width: 52px; text-align: right; }
  .row.away { opacity: .4; }
  .crown { color: var(--gold); margin-left: 4px; }
  .waiting { text-align: center; padding: 10px 0 4px; }
  .waiting .orb { width: 70px; height: 70px; margin: 4px auto 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--ice) 25%, #3A2F8A 70%); box-shadow: 0 0 40px #9FD8FF88, inset 0 0 20px #fff6; animation: breathe2 3s ease-in-out infinite; }
  @keyframes breathe2 { 50% { transform: scale(1.08); box-shadow: 0 0 70px #9FD8FFaa, inset 0 0 20px #fff8; } }
  .host-bar { display: flex; gap: 8px; margin-top: 16px; }
  .host-bar button { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #F2C46D55; background: #0B0A1F88; font-family: var(--display); letter-spacing: .08em; cursor: pointer; }
  .err { text-align: center; padding-top: 30vh; color: var(--muted); font-size: 22px; }
  .conn { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px; z-index: 9; font-family: var(--display); font-size: 10px; letter-spacing: .14em; color: var(--wrong); }

  /* the card again, full screen, from the header */
  #zoom { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #0B0A1Fee; backdrop-filter: blur(8px); }
  #zoom img { width: min(86vw, 62vh, 460px); border-radius: 4.5% / 3.2%; box-shadow: 0 0 0 1px #F2C46D66, 0 30px 80px #000, 0 0 80px #F2C46D44; animation: pop .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: scale(.7) rotateY(30deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .float.on, .ring svg, .wand { animation: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="flash" id="flash"></div>
<div class="conn hidden" id="conn">RICONNESSIONE…</div>
<main>
  <section id="intro" class="hidden">
    <div>
      <div class="seal">Hogwarts · Anno II · Serata quiz</div>
      <h1 class="hello" id="hello">Benvenuto</h1>
      <p class="sub" id="intro-sub">Il Cappello ha scelto una carta per te. Avvicina la bacchetta.</p>
      <button class="wand" id="cast">Rivela la tua carta</button>
    </div>
  </section>

  <section id="reveal" class="hidden">
    <div class="stage">
      <div class="ring" id="ring">
        <svg viewBox="0 0 200 200" fill="none" stroke="#F2C46D" stroke-width=".6">
          <defs><path id="arc" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0"/></defs>
          <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="88" stroke-dasharray="2 4"/>
          <circle cx="100" cy="100" r="70" stroke-opacity=".5"/>
          <g font-family="Cinzel" font-size="7" fill="#F2C46D" stroke="none" letter-spacing="3">
            <text><textPath href="#arc">✦ LUMOS ✦ ALOHOMORA ✦ WINGARDIUM LEVIOSA ✦ EXPELLIARMUS ✦ FINITE INCANTATEM ✦ </textPath></text>
          </g>
          <g stroke-opacity=".7"><path d="M100 4 L104 14 L100 24 L96 14Z"/><path d="M100 176 L104 186 L100 196 L96 186Z"/><path d="M4 100 L14 96 L24 100 L14 104Z"/><path d="M176 100 L186 96 L196 100 L186 104Z"/></g>
        </svg>
      </div>
      <div class="float" id="float">
        <div class="tilt" id="tilt">
          <div class="card" id="card">
            <div class="face back">
              <svg viewBox="0 0 100 140" fill="none">
                <circle cx="50" cy="70" r="40" stroke="#F2C46D" stroke-width="1.4"/>
                <circle cx="50" cy="70" r="34" stroke="#F2C46D" stroke-width=".6" stroke-dasharray="1.5 2.5"/>
                <path d="M56 34 L36 74 L50 74 L42 106 L66 62 L52 62 L60 34Z" fill="#F2C46D"/>
                <g fill="#FFE7A8"><circle cx="50" cy="14" r="1.6"/><circle cx="50" cy="126" r="1.6"/><circle cx="14" cy="70" r="1.2"/><circle cx="86" cy="70" r="1.2"/></g>
              </svg>
            </div>
            <div class="face front" id="front">
              <div class="noimg hidden" id="noimg">⚡</div>
              <img id="art" alt="">
              <div class="holo"></div>
              <div class="sheen" id="sheen"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <h2 class="card-title" id="card-title"></h2>
    <div class="card-name" id="card-name"></div>
    <button class="wand" id="enter">Entra nella partita</button>
  </section>

  <section id="game" class="hidden">
    <div class="me" id="me"></div>
    <div id="body"></div>
  </section>

  <div class="err hidden" id="err"></div>
</main>
<div id="zoom" class="hidden"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('k') || '';
  const api = (p) => `/quiz/api/${p}${p.includes('?') ? '&' : '?'}k=${encodeURIComponent(key)}`;
  const card = (id) => `/quiz/card/${id}?k=${encodeURIComponent(key)}`;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const SEEN = `quiz.seen.${key}`;

  let S = null;            // last state from the server
  let me = null;
  let draft = '';          // a free answer being typed survives re-renders
  let lastQ = null;

  // ── the sky: drifting dust, and bursts on cue ─────────────────────────
  const sky = $('sky');
  const ctx = sky.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const dust = [], sparks = [];
  function size() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = sky.width = innerWidth * dpr; H = sky.height = innerHeight * dpr;
  }
  size(); addEventListener('resize', size);
  for (let i = 0; i < 90; i++) dust.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, s: Math.random() * .00015 + .00003, p: Math.random() * 6.28 });
  const GOLD = ['#FFE7A8', '#F2C46D', '#FFFFFF', '#9FD8FF', '#FF4FA3'];
  function burst(x, y, n = 120, power = 9, palette = GOLD) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (Math.random() ** .6) * power * dpr;
      sparks.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2 * dpr, life: 1, decay: .008 + Math.random() * .014, r: (Math.random() * 2 + .8) * dpr, c: palette[(Math.random() * palette.length) | 0], g: .06 * dpr });
    }
  }
  let swirl = null; // particles spiralling into a point
  function startSwirl(x, y, ms) {
    swirl = { x: x * dpr, y: y * dpr, until: performance.now() + ms, parts: [] };
    for (let i = 0; i < 220; i++) {
      const a = Math.random() * Math.PI * 2, d = (Math.max(W, H) * (.35 + Math.random() * .4));
      swirl.parts.push({ a, d, sp: .02 + Math.random() * .03, r: (Math.random() * 1.8 + .6) * dpr, c: GOLD[(Math.random() * GOLD.length) | 0] });
    }
  }
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const d of dust) {
      d.y -= d.s; if (d.y < -0.02) d.y = 1.02;
      const tw = .45 + .55 * Math.sin(t / 900 + d.p);
      ctx.globalAlpha = tw * .7; ctx.fillStyle = '#FFF3D0';
      ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r * dpr, 0, 6.28); ctx.fill();
    }
    if (swirl) {
      const left = Math.max(0, (swirl.until - t));
      ctx.globalCompositeOperation = 'lighter';
      for (const p of swirl.parts) {
        p.a += p.sp * (1 + (1 - left / 2000) * 3);
        p.d *= left > 0 ? .975 : .8;
        const x = swirl.x + Math.cos(p.a) * p.d, y = swirl.y + Math.sin(p.a) * p.d * .8;
        ctx.globalAlpha = .9; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.28); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      if (left <= 0 && swirl.parts[0].d < 2) swirl = null;
    }
    if (sparks.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.vx *= .985; s.vy = s.vy * .985 + s.g; s.x += s.vx; s.y += s.vy; s.life -= s.decay;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.min(1, s.life * 1.4); ctx.fillStyle = s.c;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.5 + s.life / 2), 0, 6.28); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const buzz = (p) => { try { navigator.vibrate?.(p); } catch {} };

  // ── tilt: finger or gyroscope ─────────────────────────────────────────
  const tilt = $('tilt'), front = $('front');
  function setTilt(nx, ny) { // -1..1
    tilt.style.transform = `rotateY(${nx * 14}deg) rotateX(${-ny * 14}deg)`;
    front.style.setProperty('--hx', `${50 + nx * 40}%`);
    front.style.setProperty('--hy', `${40 + ny * 40}%`);
  }
  addEventListener('pointermove', (e) => { if (!$('reveal').classList.contains('hidden')) setTilt(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); });
  function gyro() {
    addEventListener('deviceorientation', (e) => {
      if (e.gamma == null || $('reveal').classList.contains('hidden')) return;
      setTilt(Math.max(-1, Math.min(1, e.gamma / 30)), Math.max(-1, Math.min(1, (e.beta - 45) / 30)));
    });
  }

  // ── the reveal ────────────────────────────────────────────────────────
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function cast() {
    // iOS asks for motion access only from a tap
    try { if (typeof DeviceOrientationEvent?.requestPermission === 'function') { if (await DeviceOrientationEvent.requestPermission() === 'granted') gyro(); } else gyro(); } catch {}
    $('intro').classList.add('hidden');
    $('reveal').classList.remove('hidden');
    const el = $('card');
    const r = document.querySelector('.stage').getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    buzz(30);
    startSwirl(cx, cy, 1500);
    await wait(1300);
    $('flash').classList.add('go');
    burst(cx, cy, 160, 7);
    el.classList.add('arrive');
    buzz([20, 40, 20]);
    $('ring').classList.add('on');
    await wait(1900);
    el.classList.remove('arrive'); el.style.opacity = 1; el.style.transform = 'none';
    void el.offsetWidth;
    el.classList.add('flip');
    await wait(520);
    burst(cx, cy, 260, 13);
    burst(cx, cy, 80, 6, ['#FF4FA3', '#9FD8FF', '#FFFFFF']);
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    buzz([40, 30, 80]);
    await wait(600);
    el.classList.remove('flip'); el.style.transform = ''; el.classList.add('done');
    $('float').classList.add('on');
    $('sheen').classList.add('go');
    const title = $('card-title');
    title.innerHTML = [...me.title].map((c) => `<span>${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('');
    const spans = [...title.children];
    for (let i = 0; i < spans.length; i++) { await wait(55); spans[i].classList.add('in'); }
    $('card-name').textContent = me.name;
    $('card-name').classList.add('in');
    await wait(500);
    $('enter').classList.add('in');
    store.set(SEEN, '1');
    fetch(api('join'), { method: 'POST' }).catch(() => {});
    // a slow shimmer now and then while it floats
    setInterval(() => { const s = $('sheen'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); }, 6000);
  }

  // ── the game ──────────────────────────────────────────────────────────
  function chip(p, on) {
    return `<div class="face-chip ${on ? 'on' : ''}" title="${esc(p.name)}"><div class="ini">${esc(p.name[0])}</div><img src="${card(p.id)}" alt="" onerror="this.remove()"></div>`;
  }
  function thumb(p) {
    return `<div class="ph" style="position:relative"><img src="${card(p.id)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.remove()"></div>`;
  }

  function renderMe() {
    if (S.you.host) {
      $('me').innerHTML = `<div class="who"><div class="t">PRESENTATORE</div><div class="n">Schermo del quiz</div></div><div class="pts"><b>${S.asked}</b><small>DOMANDE</small></div>`;
      return;
    }
    const rank = S.standings.findIndex((p) => p.id === me.id) + 1;
    const mine = S.standings.find((p) => p.id === me.id);
    $('me').innerHTML = `<div id="me-card">${thumb(me)}</div><div class="who"><div class="t">${esc(me.title)}</div><div class="n">${esc(me.name)}</div></div><div class="pts"><b>${mine?.score ?? 0}</b><small>${rank}° POSTO</small></div>`;
    $('me-card').onclick = () => {
      $('zoom').innerHTML = `<img src="${card(me.id)}" alt="">`;
      $('zoom').classList.remove('hidden');
      burst(innerWidth / 2, innerHeight / 2, 120, 9);
    };
  }
  $('zoom').onclick = () => $('zoom').classList.add('hidden');

  function board(results) {
    const lead = S.standings[0]?.score ?? 0;
    return `<ol class="board">${S.standings.map((p, i) => {
      const r = results?.[p.id];
      const said = results ? (r ? `<span class="said ${r.right ? 'r' : 'w'}">${esc(r.answer)}${r.right ? ` · +${r.points}` : ''}</span>` : `<span class="said">—</span>`) : '';
      return `<li class="row ${p.id === me?.id ? 'me-row' : ''} ${p.joined ? '' : 'away'}">
        <span class="pos">${i + 1}</span>${thumb(p)}
        <span class="nm"><b>${esc(p.name)}${i === 0 && lead > 0 ? '<span class="crown">♛</span>' : ''}</b>${said || `<small>${esc(p.title)}</small>`}</span>
        <span class="sc">${p.score}</span></li>`;
    }).join('')}</ol>`;
  }

  let timerRaf = 0;
  function runTimer(openedAt) {
    cancelAnimationFrame(timerRaf);
    const bar = document.querySelector('.timer i');
    if (!bar) return;
    const tick = () => {
      const left = Math.max(0, 1 - (Date.now() - openedAt) / 30000);
      bar.style.transform = `scaleX(${left})`;
      if (left > 0 && document.body.contains(bar)) timerRaf = requestAnimationFrame(tick);
    };
    tick();
  }

  async function answer(value) {
    buzz(15);
    try {
      const r = await fetch(api('answer'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value }) });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error);
      apply(out);
    } catch (err) {
      alert(err.message || 'Non è arrivata, riprova.');
    }
  }

  function render() {
    renderMe();
    const c = S.current;
    const body = $('body');
    if (!c) {
      body.innerHTML = `<div class="panel"><div class="waiting"><div class="orb"></div>
        <div class="kicker">${S.asked ? `${S.asked} domand${S.asked === 1 ? 'a' : 'e'} finora` : 'Il film sta per iniziare'}</div>
        <p class="explain" style="margin:8px 0 0">Goditi il film: quando arriva una domanda il film si ferma e la vedi qui.</p></div></div>
        <div class="panel"><div class="kicker">Classifica</div>${board()}</div>`;
      return;
    }
    const q = c.question;
    const head = `<div class="kicker">Domanda ${c.number}${c.total ? ` di ${c.total}` : ''}</div><div class="q">${esc(q.question)}</div>`;
    const room = S.standings.filter((p) => p.joined);

    if (c.phase === 'open') {
      const mine = c.mine;
      let ui;
      if (q.type === 'text') {
        ui = mine
          ? `<div class="sent">Hai risposto <b>${esc(mine)}</b>. Aspettiamo gli altri…</div>`
          : `<form class="text-row" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" placeholder="La tua risposta" value="${esc(draft)}"><button class="go" id="tb">Invia</button></form>`;
      } else {
        ui = `<div class="opts ${mine ? 'locked' : ''}">${q.options.map((o, i) =>
          `<button class="opt ${mine === o ? 'picked' : ''}" data-i="${i}" ${mine || S.you.host ? 'disabled' : ''}><span class="l">${'ABCDEFGH'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
          + (mine ? `<div class="sent">Risposta inviata: <b>${esc(mine)}</b>. Aspettiamo gli altri…</div>` : '');
      }
      if (S.you.host && q.type === 'text') ui = '';
      body.innerHTML = `<div class="panel">${head}<div class="timer"><i></i></div>${ui}
        <div class="faces">${room.map((p) => chip(p, c.answered.includes(p.id))).join('')}</div>
        ${S.you.host ? `<div class="host-bar"><button id="hr">Rivela</button><button id="hc">Chiudi</button></div>` : ''}</div>`;
      runTimer(c.openedAt);
      body.querySelectorAll('.opt').forEach((b) => b.onclick = () => {
        const i = Number(b.dataset.i);
        answer(q.type === 'truefalse' ? i === 0 : i);
      });
      const tf = $('tf');
      if (tf) {
        const ti = $('ti');
        ti.oninput = () => { draft = ti.value; };
        if (lastQ !== c.id) ti.focus();
        tf.onsubmit = (e) => { e.preventDefault(); if (ti.value.trim()) answer(ti.value.trim()); };
      }
    } else {
      const r = S.you.host ? null : c.results?.[me.id];
      const cls = r ? (r.right ? 'ok' : 'ko') : 'none';
      const big = r ? (r.right ? 'Giusto!' : 'Sbagliato') : (S.you.host ? 'Risultati' : 'Nessuna risposta');
      const opts = q.options ? `<div class="opts locked">${q.options.map((o, i) =>
        `<div class="opt ${i === c.rightIndex ? 'right' : ''} ${r && !r.right && r.answer === o ? 'wrong' : ''}"><span class="l">${'ABCDEFGH'[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>` : '';
      body.innerHTML = `<div class="panel">
        <div class="verdict ${cls}"><div class="big">${big}</div>${r?.right ? `<div class="plus">+${r.points} punti</div>` : ''}</div>
        ${head}${opts}
        <div class="answer-line">Risposta: <b>${esc(c.right)}</b></div>
        ${c.explain ? `<div class="explain">${esc(c.explain)}</div>` : ''}
        ${S.you.host ? `<div class="host-bar"><button id="hc">Chiudi</button></div>` : ''}</div>
        <div class="panel"><div class="kicker">Classifica</div>${board(c.results)}</div>`;
    }
    const hr = $('hr'), hc = $('hc');
    if (hr) hr.onclick = () => fetch(api('host/reveal'), { method: 'POST' });
    if (hc) hc.onclick = () => fetch(api('host/close'), { method: 'POST' });
  }

  function apply(next) {
    const prev = S;
    S = next;
    if (!S.you.host) me = S.you;
    if ($('game').classList.contains('hidden')) return;
    const c = S.current;
    // moments worth a flourish
    if (c && c.id !== lastQ && c.phase === 'open') { buzz([60, 40, 60]); burst(innerWidth / 2, 120, 60, 6); draft = ''; }
    if (c && c.phase === 'revealed' && prev?.current?.phase !== 'revealed') {
      const r = c.results?.[me?.id];
      if (r?.right) { burst(innerWidth / 2, innerHeight / 3, 220, 12); buzz([30, 30, 30, 30, 120]); }
      else if (r) buzz(200);
    }
    lastQ = c?.id ?? null;
    // keep a half-typed answer and the keyboard where they are
    const typing = document.activeElement?.id === 'ti' && c?.phase === 'open' && !c.mine;
    if (typing) { renderMe(); document.querySelectorAll('.faces').forEach((f) => f.innerHTML = S.standings.filter((p) => p.joined).map((p) => chip(p, c.answered.includes(p.id))).join('')); return; }
    render();
  }

  function enterGame() {
    $('reveal').classList.add('hidden');
    $('intro').classList.add('hidden');
    $('game').classList.remove('hidden');
    lastQ = S.current?.id ?? null;
    render();
  }

  function connect() {
    const es = new EventSource(api('events'));
    es.onmessage = (e) => { $('conn').classList.add('hidden'); apply(JSON.parse(e.data)); };
    es.onerror = () => $('conn').classList.remove('hidden');
  }

  async function boot() {
    if (!key) return fail('Ti serve il tuo link personale.');
    let r;
    try { r = await fetch(api('me')); } catch { return fail('Il castello non risponde. Riprova tra poco.'); }
    if (!r.ok) return fail('Questo link non apre nessuna porta.');
    S = await r.json();
    if (S.you.host) { enterGame(); connect(); return; }
    me = S.you;
    const art = $('art');
    art.src = card(me.id);
    art.onerror = () => { art.remove(); $('noimg').classList.remove('hidden'); };
    $('hello').textContent = `Ciao ${me.name}`;
    $('enter').onclick = () => { burst(innerWidth / 2, innerHeight - 80, 80, 7); enterGame(); };
    connect();
    if (store.get(SEEN)) {
      // already revealed on this phone: straight in, with the card one tap away
      enterGame();
      fetch(api('join'), { method: 'POST' }).catch(() => {});
    } else {
      $('intro').classList.remove('hidden');
      $('cast').onclick = cast;
    }
  }
  function fail(msg) { $('err').textContent = msg; $('err').classList.remove('hidden'); }
  boot();
})();
</script>
</body>
</html>
