# LiteLLM gateway in front of Ollama: per-user API keys, usage and limits.
# Speaks OpenAI Chat Completions, OpenAI Responses and Anthropic Messages.
# Costs are 0 on purpose: nothing is billed, the spend pages become token counters.

# Upstream is Ollama's own OpenAI-compatible API (`openai/`, /v1), not LiteLLM's
# `ollama_chat/` adapter: in v1.102.1 that adapter crashes on Codex's Responses requests
# (`reasoning` arrives as an object, map_openai_params does `value in {...}` on it,
# TypeError: unhashable type: 'dict'). Ollama serves /v1/chat/completions and
# /v1/responses natively; LiteLLM translates Anthropic /v1/messages onto chat.
model_list:
  # Default for agents and scripts: no reasoning, the answer starts right away.
  - model_name: qwen3.6
    litellm_params:
      model: openai/qwen3.6:35b-a3b-q4_K_M
      api_base: http://ollama:11434/v1
      api_key: ollama
      reasoning_effort: none
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 65536
      max_output_tokens: 16384
      supports_function_calling: true
      supports_vision: true

  # Same weights, reasoning on. Better on hard problems, often minutes per answer here.
  - model_name: qwen3.6-thinking
    litellm_params:
      model: openai/qwen3.6:35b-a3b-q4_K_M
      api_base: http://ollama:11434/v1
      api_key: ollama
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_input_tokens: 65536
      max_output_tokens: 16384
      supports_function_calling: true
      supports_vision: true
      supports_reasoning: true

litellm_settings:
  drop_params: true
  request_timeout: 1800 # an agent turn can spend minutes reading its prompt on this box

  default_internal_user_params:
    user_role: internal_user
    models: [qwen3.6, qwen3.6-thinking]

  # What a key gets when the user sets nothing, and the ceiling they cannot exceed.
  # One GPU, one request at a time in Ollama: a key may have two in flight (agents fire
  # side requests), the second just queues. Nobody can open more than that.
  default_key_generate_params:
    max_parallel_requests: 2
    rpm_limit: 30
    tpm_limit: 300000
  upperbound_key_generate_params:
    max_parallel_requests: 2
    rpm_limit: 30
    tpm_limit: 300000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Admin UI login: username `admin`, password is the LITELLM_MASTER_KEY (the env
  # credential path). Set disable_env_credential_login back to true to require a real
  # proxy_admin DB user with its own password instead.
  disable_env_credential_login: false
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
