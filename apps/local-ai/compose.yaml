# Ollama on the mini PC, deployed by Dokploy on push.
# The published port is bound to 127.0.0.1: Ollama has no auth, and Docker's
# published ports skip UFW, so a bare "11434:11434" was open to the whole LAN
# and tailnet. Nothing here is on the Cloudflare tunnel.
# Open WebUI and its SearXNG were removed for good on 2026-11-23, the LiteLLM
# gateway (litellm, llm-keepalive, litellm-db, llm.davideghiotto.it) on 2026-11-25.
services:
  ollama:
    image: ollama/ollama:0.40.18
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Radeon 760M (gfx1103) through Vulkan. The render group is 992 on the host.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - video
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_VULKAN: "1"
      OLLAMA_IGPU_ENABLE: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # 64k because coding agents send 15-30k tokens of system prompt and tools per turn.
      OLLAMA_CONTEXT_LENGTH: "65536"
      # The box also runs ~55 other containers: one model, and unload after 15 idle
      # minutes so the RAM goes back to them. One request at a time: Ollama 0.34.4 forces
      # it for this architecture anyway ("model architecture does not currently support
      # parallel requests" architecture=qwen35moe). KV cache at 64k is ~0.7 GB.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 15m
    mem_limit: 30g

volumes:
  ollama:
    name: ollama
