# Cinema's front end. Portable between the two boxes it might live on, because
# where Jellyfin is and which port is free differ per host:
#
#   NAS (beside Jellyfin, the real deployment):
#     JELLYFIN_UPSTREAM=http://172.17.0.1:8899 CINEMA_PORT=8898 docker compose up -d --build
#
#   mini PC (Dokploy, mediarr's Jellyfin):
#     JELLYFIN_UPSTREAM=http://jellyfin:8096 CINEMA_PORT=3003 docker compose up -d --build
#
# See docs/DEPLOY.md.
services:
  cinema-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: cinema-web
    restart: unless-stopped
    environment:
      # Where nginx sends /jf/. On the NAS Jellyfin sits on the default bridge
      # with no DNS alias, so it is reached through the bridge gateway rather
      # than by name.
      JELLYFIN_UPSTREAM: ${JELLYFIN_UPSTREAM:-http://172.17.0.1:8899}
    ports:
      - "${CINEMA_PORT:-8898}:80"
