server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The SPA owns its routes; anything that is not a file is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2|svg|png|jpg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything the Jellyfin SDK does goes through here, mirroring the Vite dev
  # proxy. proxy_buffering off keeps seeking responsive: with buffering on,
  # nginx pulls ahead of the player on every range request.
  location /jf/ {
    proxy_pass ${JELLYFIN_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 1h;
  }
}

map $http_upgrade $proxy_connection {
  default upgrade;
  ''      close;
}
