server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # nginx defaults to gzip off, and the edge only compresses what goes through
  # it: the LAN address and the hop to cloudflared were shipping the bundle
  # whole. No brotli -- it is not in nginx:1.27-alpine, and Cloudflare already
  # answers br where it matters.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    image/svg+xml;

  # The SPA owns its routes; anything that is not a file is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Our own bundle only. This is a REGEX location, and in nginx a matching regex
  # beats a prefix location -- so without the `^~` on /jf/ below, every
  # .js and .css under /jf/web/ landed here, was looked for on local disk and
  # 404'd. The Jellyfin admin UI loaded its HTML and nothing else: a black page.
  location ~* \.(js|css|woff2|svg|png|jpg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything the Jellyfin SDK does goes through here, mirroring the Vite dev
  # proxy. proxy_buffering off keeps seeking responsive: with buffering on,
  # nginx pulls ahead of the player on every range request.
  # `^~`: match this prefix and stop -- do not let the asset regex above steal
  # the admin UI's bundles. Everything under here belongs to Jellyfin.
  location ^~ /jf/ {
    proxy_pass ${JELLYFIN_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $proxy_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 1h;
  }
}

map $http_upgrade $proxy_connection {
  default upgrade;
  ''      close;
}
