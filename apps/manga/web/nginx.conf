# Yomu is the public face of the stack (manga.davideghiotto.it, through the
# tunnel). It forwards to Kavita only the API routes the reader calls: sign in,
# shelf, series, pages, progress, and the admin-only scan. Everything else under
# /api -- users, settings, libraries, uploads, Kavita's own UI -- is a 404 here,
# and stays reachable on the LAN at debian:5000.

# Path only, not the query: covers and pages carry ?apiKey=.
map $uri $kavita_route {
  default 0;
  ~^/api/account/refresh-token$ 1;
  ~^/api/series/(all-v2|on-deck|series-detail|metadata|[0-9]+)$ 1;
  ~^/api/reader/(chapter-info|get-progress|progress|next-chapter|prev-chapter|image)$ 1;
  ~^/api/image/(series-cover|chapter-cover)$ 1;
  ~^/api/library/scan-all$ 1;
}

# nginx matches the allowlist against the normalised path, but proxy_pass with
# no URI forwards the path as the client sent it. Refuse anything whose raw path
# carries dot segments or encoded slashes, so the two can never disagree.
map $request_uri $raw_path_ok {
  default 1;
  "~*^[^?]*(\.\.|%2e|%2f|%5c)" 0;
}

limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

  # cloudflared runs on the host and arrives through the Docker bridge; LAN
  # clients arrive with their own address and cannot set this header for us.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  # The SPA owns its routes; anything that is not a file is index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite's hashed bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /api/account/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    if ($raw_path_ok = 0) { return 400; }
    proxy_pass http://kavita:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 1m;
  }

  location ^~ /api/ {
    if ($raw_path_ok = 0) { return 400; }
    if ($kavita_route = 0) { return 404; }
    proxy_pass http://kavita:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    client_max_body_size 1m;
  }
}
