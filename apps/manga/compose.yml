# manga -- download chapters, read them. Only the reader is public:
#
#   Suwayomi  ->  MANGA_ROOT/mangas/<source>/<series>/<chapter>.cbz  ->  Kavita  <-  Yomu
#   (finds and downloads, LAN only)                        (library, LAN only)   (reader, public)
#
# manga.davideghiotto.it reaches Yomu through the host's cloudflared. Yomu's
# nginx forwards only the reader's Kavita routes; Suwayomi (no auth) and Kavita's
# admin UI are on the LAN ports and nowhere else.
#
# Suwayomi writes every chapter as a CBZ with a ComicInfo.xml inside; Kavita
# mounts the same folder read-only and takes the series name from that file,
# so the <source> level in the path does not split one series into several.
#
# Environment -- see .env.example:
#   MANGA_ROOT      host folder for the downloads, required
#   SUWAYOMI_PORT   default 4567
#   KAVITA_PORT     default 5000 (macOS AirPlay holds 5000; use 5001 on a Mac)
#   YOMU_PORT       default 4571, the tunnel's upstream
#   KAVITA_API_KEY  an admin auth key; without it `covers` only saves the files,
#                   and `scripts` serves chapter scripts but has no search
#   TZ              default Europe/Rome

services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Rome}
      DOWNLOAD_AS_CBZ: "true"
      AUTO_DOWNLOAD_CHAPTERS: "true"
      # Suwayomi ships with no extension store. Keiyoushi is the one Mihon users add;
      # v2 renamed the variable from EXTENSION_REPOS, which it now ignores.
      EXTENSION_STORES: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]'
    # The ISP resolver (Axera, via the router) answers mangadex.org with its own
    # block page, whose self-signed cert fails Java's PKIX check. Public resolvers
    # return the real address, and nothing blocks the connection itself.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    ports:
      - "${SUWAYOMI_PORT:-4567}:4567"
    volumes:
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
      - ${MANGA_ROOT:?set MANGA_ROOT}:/home/suwayomi/.local/share/Tachidesk/downloads

  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${KAVITA_PORT:-5000}:5000"
    volumes:
      - kavita-config:/kavita/config
      - ${MANGA_ROOT:?set MANGA_ROOT}/mangas:/manga:ro

  # Gives each Kavita series its real cover (Suwayomi's thumbnail, cached as
  # cover.jpg in the series folder) instead of its first chapter's first page,
  # through Kavita's upload API. Needs KAVITA_API_KEY for the upload. See
  # covers/covers.py.
  covers:
    image: python:3.13-alpine
    container_name: manga-covers
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - suwayomi
      - kavita
    environment:
      TZ: ${TZ:-Europe/Rome}
      KAVITA_API_KEY: ${KAVITA_API_KEY:-}
      COVERS_INTERVAL: "600"
    command: ["python", "-u", "/app/covers.py"]
    volumes:
      - ./covers:/app:ro
      - ${MANGA_ROOT:?set MANGA_ROOT}/mangas:/mangas

  # Chapter scripts (who says what, per page) for Yomu's reader and search.
  # Read-only: `transcribe` writes MANGA_ROOT/scripts, this only serves it.
  # Every request carries the reader's Kavita token, which it checks with
  # Kavita; KAVITA_API_KEY is only for mapping files to chapter ids, which
  # the search index needs. No host port: Yomu reaches it on the compose
  # network. See transcribe/serve.py.
  scripts:
    image: python:3.13-alpine
    container_name: manga-scripts
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - kavita
    environment:
      TZ: ${TZ:-Europe/Rome}
      KAVITA_API_KEY: ${KAVITA_API_KEY:-}
      SCRIPTS_DIR: /scripts
      INDEX_DB: /tmp/scripts-index.db
    command: ["python", "-u", "/app/serve.py"]
    volumes:
      - ./transcribe/serve.py:/app/serve.py:ro
      - ${MANGA_ROOT:?set MANGA_ROOT}/scripts:/scripts:ro

  yomu:
    build: ./web
    container_name: yomu
    restart: unless-stopped
    depends_on:
      - kavita
    ports:
      - "${YOMU_PORT:-4571}:80"

volumes:
  suwayomi-data:
  kavita-config:
