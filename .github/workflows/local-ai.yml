name: local-ai

# Checks on every push and pull request touching apps/local-ai; a push to main that passes
# is deployed by Dokploy through the shared dokploy-deploy workflow.
on:
  push:
    branches: [main]
    paths:
      - apps/local-ai/**
      - .github/workflows/local-ai.yml
      - .github/workflows/dokploy-deploy.yml
  pull_request:
    paths:
      - apps/local-ai/**
      - .github/workflows/local-ai.yml

# Queue rather than cancel: a cancelled run leaves main green but undeployed.
concurrency:
  group: local-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid
        env:
          DATABASE_URL: ci
          LAN_HOST: ci
          LAN_IP: ci
          LITELLM_MASTER_KEY: ci
          LITELLM_SALT_KEY: ci
          LLM_HOST: ci
          OPENUI_HOST: ci
          POSTGRES_PASSWORD: ci
          SEARXNG_SECRET: ci
          TAILNET_HOST: ci
          WEBUI_SECRET_KEY: ci
        run: docker compose -f apps/local-ai/compose.yaml config --quiet

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dokploy-deploy.yml
    with:
      app: local-ai
    secrets:
      compose-id: ${{ secrets.DOKPLOY_COMPOSE_ID_LOCAL_AI }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
