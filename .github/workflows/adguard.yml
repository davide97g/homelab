name: adguard

# Checks on every push and pull request touching apps/adguard; a push to main that passes
# is deployed by Dokploy through the shared dokploy-deploy workflow.
on:
  push:
    branches: [main]
    paths:
      - apps/adguard/**
      - .github/workflows/adguard.yml
      - .github/workflows/dokploy-deploy.yml
  pull_request:
    paths:
      - apps/adguard/**
      - .github/workflows/adguard.yml

# Queue rather than cancel: a cancelled run leaves main green but undeployed.
concurrency:
  group: adguard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid
        run: docker compose -f apps/adguard/compose.yaml config --quiet

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dokploy-deploy.yml
    with:
      app: adguard
      compose-file: apps/adguard/compose.yaml
    secrets:
      compose-id: ${{ secrets.DOKPLOY_COMPOSE_ID_ADGUARD }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      HUB_CHECKS_TOKEN: ${{ secrets.HUB_CHECKS_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
