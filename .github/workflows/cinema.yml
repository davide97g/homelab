name: cinema

# Checks on every push and pull request touching apps/cinema. Nothing deploys from here:
# Cinema runs only on the NAS, shipped by hand (apps/cinema/docs/DEPLOY.md). The mini PC
# copy and its Dokploy app were removed on 2026-10-10.
on:
  push:
    branches: [main]
    paths:
      - apps/cinema/**
      - "!apps/cinema/apps/ios/**"
      - "!apps/cinema/apps/android/**"
      - .github/workflows/cinema.yml
  pull_request:
    paths:
      - apps/cinema/**
      - "!apps/cinema/apps/ios/**"
      - "!apps/cinema/apps/android/**"
      - .github/workflows/cinema.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: apps/cinema
      - run: bun run lint
        working-directory: apps/cinema
      - run: bun run build
        working-directory: apps/cinema
      - name: Compose file is valid
        run: docker compose -f apps/cinema/services/web/compose.yaml config --quiet

