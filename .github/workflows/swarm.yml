name: swarm

# Checks on every push and pull request touching stacks/swarm; a push to main that passes
# is deployed by Dokploy through the shared dokploy-deploy workflow.
on:
  push:
    branches: [main]
    paths:
      - stacks/swarm/**
      - .github/workflows/swarm.yml
      - .github/workflows/dokploy-deploy.yml
  pull_request:
    paths:
      - stacks/swarm/**
      - .github/workflows/swarm.yml

# Queue rather than cancel: a cancelled run leaves main green but undeployed.
concurrency:
  group: swarm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: stacks/swarm
      - run: pnpm typecheck
        working-directory: stacks/swarm
      - run: pnpm build
        working-directory: stacks/swarm
      - name: Compose file is valid
        run: docker compose -f stacks/swarm/compose.yml config --quiet

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dokploy-deploy.yml
    with:
      app: swarm
    secrets:
      compose-id: ${{ secrets.DOKPLOY_COMPOSE_ID_SWARM }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
