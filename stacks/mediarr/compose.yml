# mediarr -- the request-to-file chain, running on the homelab box.
#
#   Jellyseerr  ->  Radarr / Sonarr  ->  Prowlarr  ->  qBittorrent
#     (asks)          (decides)          (searches)    (downloads)
#                                                          |
#                                        hardlink into library/, then
#                                        xfer-nas copies it to the NAS
#                                                          |
#                                                  Jellyfin (on the NAS)
#
# Jellyfin is not in this stack. It runs on the NAS, and `~/xfer-nas-auto.sh`
# copies each finished folder there; `jellyfin-proxy` below is only a header
# shim so Jellyseerr can reach it.
#
# Every service mounts MEDIA_ROOT at the same path, /data. Identical mounts
# across containers is what lets Radarr hardlink a finished download into the
# library instead of copying it, so a seeding torrent and the library file are
# the same bytes on disk.
#
#   /data/torrents          qBittorrent's downloads
#   /data/library/movies    Radarr's library
#   /data/library/tv        Sonarr's library
#
# Environment -- see .env.example:
#   MEDIA_ROOT  host folder holding torrents/ and library/, required
#   PUID/PGID   owner of written files, default 1000:1000 (the box's `davide`)
#   TZ          default Europe/Rome

x-common: &common
  restart: unless-stopped
  networks: [mediarr]
  environment: &common-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Europe/Rome}

services:
  jellyseerr:
    <<: *common
    # Jellyseerr became Seerr and moved org; the box has been running v3.4.1
    # for weeks while this file still said fallenbagel/jellyseerr:2.7.3. A
    # deploy therefore *downgraded* it, and 2.7.3 is older than its own
    # database -- it queries user_settings.discordId, a column that the
    # AddDiscordIdsColumn migration had already renamed to discordIds, so
    # every Jellyfin sync died with `no such column`.
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: jellyseerr
    environment:
      TZ: ${TZ:-Europe/Rome}
      LOG_LEVEL: info
      PORT: 5055
    ports:
      - "5055:5055"
    volumes:
      - jellyseerr-config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Local Jellyfin, back on this box since 2026-09-19. It plays the library that
  # is already here -- the NAS holds only what xfer-nas managed to copy before
  # that timer was disabled for disk, so the full set of finished downloads is
  # readable only here.
  #
  # It keeps the config and cache volumes the old local server wrote, so its
  # users, watch state and the two libraries (/data/library/movies and
  # /data/library/tv) come back as they were. Same /data mount as the *arrs,
  # so those recorded paths still resolve.
  #
  # Published on 8097, not 8096: jellyfin-proxy below still holds 8096, and
  # hub, mediarr-dash, jarvis and Jellyseerr all mean "the NAS's Jellyfin"
  # when they say it. Two servers, two ports, nothing repointed.
  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      # The render group, for VAAPI on the Intel iGPU -- the old config already
      # says hwaccel vaapi, so without this every transcode falls back to CPU.
      - "${RENDER_GID:-992}"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8097:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The NAS's Jellyfin is still the one Jellyseerr and the public
  # cinema.davideghiotto.it talk to; this is the shim in front of it.
  #
  # This is a header shim, not a media server. Jellyseerr authenticates with
  # `X-Emby-Authorization`, the Emby-era header. The NAS runs Jellyfin 12,
  # which reads only `Authorization` and answers 401 to the old name -- verified
  # both ways: 12.1.0 gives 401 for X-Emby-Authorization and 200 for the same
  # payload under Authorization, while 10.11.11 accepts either. So Jellyseerr
  # cannot talk to the NAS directly at all, and nginx copies the header across.
  #
  # The NAS is reached at its Tailscale address because it is not on this LAN,
  # despite advertising a 192.168.15.x one.
  jellyfin-proxy:
    <<: *common
    image: nginx:1.27-alpine
    container_name: jellyfin-proxy
    # Published on the port the local Jellyfin used to hold: hub, mediarr-dash
    # and jarvis are separate compose projects that cannot resolve a name on
    # this network, and they all already say 8096.
    ports:
      - "8096:8096"
    configs:
      - source: jellyfin-proxy-conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on 0.0.0.0 only, and busybox
      # wget tries the ::1 that localhost also resolves to first, so the check
      # failed with "Connection refused" against a proxy that was serving fine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Bazarr follows Radarr and Sonarr and fetches subtitles for everything they
  # import, dropping .srt files next to the video. That is the point: text
  # subtitles render in any client, while the PGS bitmap tracks carried by a
  # Blu-ray remux only show up if Jellyfin transcodes the whole video to burn
  # them in. Same /data mount as the *arrs so the paths it is told about match.
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    ports:
      - "6767:6767"
    volumes:
      - bazarr-config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  mediarr:

configs:
  jellyfin-proxy-conf:
    content: |
      server {
        listen 8096;
        server_name _;

        location / {
          # An empty value removes the header, which is what a request that
          # already carries its own Authorization needs -- so the old one is
          # only substituted when it is actually present.
          set $$authz $$http_authorization;
          if ($$http_x_emby_authorization) { set $$authz $$http_x_emby_authorization; }
          proxy_set_header Authorization $$authz;

          proxy_pass http://${NAS_TAILNET_IP}:8899;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$http_connection;
          # Tailscale to a NAS that may be waking a disk; the default 60s read
          # timeout is not enough for a first library query.
          proxy_read_timeout 300s;
          proxy_buffering off;
          client_max_body_size 0;
        }
      }

volumes:
  jellyseerr-config:
  # The local Jellyfin's config and cache, written before it was retired and
  # read again now that it is back.
  jellyfin-config:
  jellyfin-cache:
  prowlarr-config:
  radarr-config:
  sonarr-config:
  bazarr-config:
  qbittorrent-config:
