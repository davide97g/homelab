# sysctl hardening drop-in for the mini PC (debian).
# Install as /etc/sysctl.d/99-hardening.conf, then `sudo sysctl --system`.
#
# Deliberately minimal: only settings that were off in the audit and are safe with
# Docker running (Docker needs net.ipv4.ip_forward=1, so it is NOT touched here).
#
# Apply:
#   scp hosts/mini-pc/security/99-hardening.conf homelab:/tmp/
#   ssh homelab
#   sudo install -m 0644 /tmp/99-hardening.conf /etc/sysctl.d/99-hardening.conf
#   sudo sysctl --system

# Do not leak kernel pointers to unprivileged users (was 0).
kernel.kptr_restrict = 1

# Reverse-path filtering and no ICMP redirects (were 0 / send_redirects=1).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
