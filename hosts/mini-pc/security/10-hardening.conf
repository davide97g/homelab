# SSH hardening drop-in for the mini PC (debian).
# Install as /etc/ssh/sshd_config.d/10-hardening.conf (loaded via the Include in
# sshd_config). Keys are already deployed for davide, so password login can go.
#
# Apply:
#   scp hosts/mini-pc/security/10-hardening.conf homelab:/tmp/
#   ssh homelab
#   sudo install -m 0644 /tmp/10-hardening.conf /etc/ssh/sshd_config.d/10-hardening.conf
#   sudo sshd -t && sudo systemctl reload ssh      # -t validates before reload
# Keep the current SSH session open until you have confirmed a NEW session logs in.

# Keys only. root was already key-only (Debian default prohibit-password); pin it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes

# Headless box: no X11 forwarding.
X11Forwarding no

# Tighten brute-force surface (fail2ban's sshd jail is already active on top).
MaxAuthTries 3
