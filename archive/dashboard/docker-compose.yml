# mediarr dashboard — one container serving the API and the built frontend.
#
# Deploy as a Dokploy Compose app (Raw provider) or with plain `docker compose
# up -d` from ~/mediarr-dash on the box. Either way the image is built on the
# box first; see deploy.py, which does both halves.
#
# Secrets live in /home/davide/mediarr-dash/.env, written by
# scripts/collect-env.sh straight out of the running containers. They never
# pass through Dokploy, this repo, or a laptop.
#
# The services are reached over the box's published ports rather than
# container names, so no membership in mediarr_mediarr is needed. Prometheus is
# the exception -- it is not published -- hence the one external network below.

services:
  dashboard:
    image: ${DASHBOARD_IMAGE:-mediarr-dash:latest}
    container_name: mediarr-dash
    restart: unless-stopped
    env_file:
      - path: /home/davide/mediarr-dash/.env
        required: false
    environment:
      PORT: 8080
      # Never a LAN IP: the box is on DHCP, and a new lease used to break every
      # probe. host-gateway below resolves to the box from inside this container
      # whatever its address; the public host is what the browser is handed for
      # node links, so it must resolve on the viewer's machine.
      HOMELAB_HOST: ${HOMELAB_HOST:-homelab-host}
      HOMELAB_PUBLIC_HOST: ${HOMELAB_PUBLIC_HOST:-debian}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      # Set to true once this is served over HTTPS through the tunnel, so the
      # session cookie stops travelling over plain HTTP on the LAN.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Europe/Rome}
    extra_hosts:
      - "homelab-host:host-gateway"
    ports:
      - "${DASHBOARD_PORT:-3002}:8080"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # Created by the monitoring stack. The name carries Dokploy's app slug, so it
  # changes if that app is renamed -- check with `docker network ls` and update
  # MONITORING_NETWORK if Prometheus ever reads as unreachable.
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring-frontend-fnhjyi_monitoring}
